name: Project checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: ./scripts/check-frame.sh
      - name: Run dependency-free dashboard checks
        run: ./projects/agent-dashboard/scripts/test-live-dashboard.sh
      - run: ./projects/agent-dashboard/scripts/test-dashboard-motion.sh
      - run: python3 scripts/check-docs.py

  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact public Observer/Mesh release pair
        run: python projects/agent-dashboard/scripts/install-sdk.py --wheelhouse "$RUNNER_TEMP/dashboard-sdk-wheels"
      - name: Verify SDK versions, wheel hashes, and public APIs
        run: python projects/agent-dashboard/scripts/verify-sdk.py
      - name: Run strict twelve-case installed SDK gate
        run: PYTHON="$(command -v python)" ./projects/agent-dashboard/scripts/test-dashboard-integration.sh
      - name: Run complete dashboard client suite
        env:
          RLCD_RUN_PUBLIC_INTEGRATION: '1'
          RLCD_REQUIRE_ZERO_SKIPS: '1'
        run: PYTHON="$(command -v python)" ./projects/agent-dashboard/scripts/test-live-dashboard.sh

  presentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install pillow==12.0.0
      - run: python scripts/check-docs.py
      - name: Regenerate native gallery and compare published bytes
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: |
          python scripts/render-presentation.py --build-type "$BUILD_TYPE" --output-root "$RUNNER_TEMP/gallery"
          python - "$RUNNER_TEMP/gallery" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for project in ("agent-dashboard", "render-bench", "bringup"):
              media = pathlib.Path("projects") / project / "docs/media"
              manifest = json.loads((media / "manifest.json").read_text())
              for name, record in manifest["files"].items():
                  actual = hashlib.sha256((root / project / name).read_bytes()).hexdigest()
                  assert actual == record["sha256"], (project, name, "regenerated bytes differ")
          print("PASS: regenerated project gallery matches committed PNG/GIF hashes")
          PY

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf@sha256:8ccd4d2ce413889c6c2bba57e986c670302094efb91c913c6091152e317a7805
    strategy:
      fail-fast: false
      matrix:
        variant: [bringup, render-bench, dashboard-live, dashboard-static, dashboard-motion]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build ${{ matrix.variant }} with ESP-IDF 5.5.3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          RLCD_IDF_COMMAND="$IDF_PATH/tools/idf.py" ./scripts/check-firmware.sh "${{ matrix.variant }}"
